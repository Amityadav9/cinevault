[project]
name = "cinevault"
version = "0.1.0"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.4",
    "streamlit>=1.65.0",
    "typer>=0.27.3",
]

# Make `app` an installable package: `uv sync` installs it in editable mode, so
# `import app` works from anywhere (Streamlit runs ui/main.py with ui/ as its folder).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ui"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
