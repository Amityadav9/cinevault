services:
  db:
    # Postgres 18 + pgvector (needed for embeddings in phase 5)
    image: pgvector/pgvector:pg18
    container_name: cinevault-db
    restart: unless-stopped
    env_file: .env
    ports:
      # 127.0.0.1 = only this computer can connect (not other devices on your network)
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      # PG 18+ images keep data in /var/lib/postgresql/18/docker, so mount the parent dir
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
